services:
  system:
    image: zhangjicmu/ubuntu24_ros:cmu_vla_challenge_simulation
    container_name: iros2026_system
    privileged: true
    network_mode: host
    # Fast DDS identifies host-network containers as the same host and prefers
    # shared-memory transport.  They must share the IPC namespace as well;
    # otherwise discovery works but camera/LiDAR/odometry samples never arrive.
    ipc: host
    environment:
      - DISPLAY
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/tmp/.docker.xauth
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /etc/localtime:/etc/localtime:ro
      - /dev/input:/dev/input
      - /dev/bus/usb:/dev/bus/usb
      - ../map:/home/docker/maps:ro
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ai_module:
    build:
      context: ../ai_module
      dockerfile: docker/Dockerfile
    container_name: iros2026_ai_module
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Tmah 팀이 사용하는 docker-compose 파일 (0706 생성)
  tmah_module:
    build:
      context: ../ai_module
      dockerfile: docker/Dockerfile.tmah
    container_name: iros2026_tmah_module
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    volumes:
      - ../ai_module/debug:/home/docker/ai_module/debug
      - ../ai_module/src:/home/docker/ai_module/src
    deploy:
        resources:
          reservations:
            devices:
              - driver: nvidia
                count: all
                capabilities: [gpu]

  # sysnav MVP (YOLO-World + SAM2 + Gemini) - tmah_vlm과 별개 의존성 스택이라 독립 컨테이너로 분리 (0720 생성)
  sysnav_module:
    build:
      context: ../ai_module
      dockerfile: docker/Dockerfile.sysnav
    container_name: iros2026_sysnav_module
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    env_file:
      - ../ai_module/.env
    volumes:
      - ../ai_module/src/sysnav_ros2_mvp:/home/docker/ai_module/src/sysnav_ros2_mvp
      - ../ai_module/debug:/home/docker/ai_module/debug
    deploy:
        resources:
          reservations:
            devices:
              - driver: nvidia
                count: all
                capabilities: [gpu]

  # 제출용 sysnav — Docker Hub에 올린 이미지를 그대로 실행 (2026-08-18 추가)
  # 위 sysnav_module과 달리 (1) 로컬 빌드 안 함 (2) src 바인드 마운트 안 함
  #   → 이미지 안에 COPY+colcon build 되어 있는 소스 그대로 돌아감 (제출본 검증용).
  # 사용: docker compose -f compose_gpu.yml up -d sysnav_submission
  sysnav_submission:
    image: parkjaeil00/cmu-vln-2026-sysnav:${SYSNAV_IMAGE_TAG:-submission-v1}
    pull_policy: missing
    container_name: iros2026_sysnav_submission
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    env_file:
      - ../ai_module/.env
    volumes:
      - ../ai_module/debug:/home/docker/ai_module/debug
    deploy:
        resources:
          reservations:
            devices:
              - driver: nvidia
                count: all
                capabilities: [gpu]
